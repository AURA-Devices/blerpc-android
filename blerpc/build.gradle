apply plugin: 'com.android.library'
apply plugin: 'com.google.protobuf'
apply plugin: 'net.ltgt.errorprone'

android {
    namespace "com.blerpc"

    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'com.google.code.findbugs:jsr305:3.0.0'
    }
}

dependencies {
    implementation group: 'findbugs', name: 'annotations', version: '1.0.0'
    implementation project(":blerpcproto")
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation 'com.google.protobuf:protobuf-java:3.5.1'
    implementation 'com.google.protobuf:protoc:3.6.1'
    implementation 'com.google.dagger:dagger:2.7'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.7'
    testAnnotationProcessor 'com.google.dagger:dagger-compiler:2.7'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation "org.robolectric:robolectric:4.0.2"
    testImplementation 'junit:junit:4.12'
    testImplementation "org.mockito:mockito-inline:2.7.22"
    testImplementation 'com.google.truth:truth:0.40'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.6.1'
    }
    plugins {}
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}
