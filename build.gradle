buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.9.4'
        classpath "net.ltgt.gradle:gradle-errorprone-plugin:4.2.0"
        classpath "com.github.spotbugs:com.github.spotbugs.gradle.plugin:6.4.2"
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:2.7.18'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        gradlePluginPortal()
    }

    tasks.withType(Javadoc).tap {
        configureEach {
            options.addStringOption('Xdoclint:none', '-quiet')
            options.addStringOption('encoding', 'UTF-8')
        }
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}

project(':blerpc') {
    apply plugin: 'com.android.library'
}

apply from: "linters/configs/android-lint.build.gradle"
apply from: "linters/configs/checkstyle.build.gradle"
apply from: "linters/configs/error-prone.build.gradle"
// TODO: restore findbugs/spotbugs checker.
